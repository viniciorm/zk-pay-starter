[package]
name = "veil_pool"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "28", features = ["hazmat-crypto"] }
soroban-poseidon = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils", "hazmat-crypto"] }
